services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./data/seed:/seed:ro
      - static_volume:/static
      - media_volume:/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    environment:
      # Allow overriding via .env; defaults primarily for local dev
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://localhost:5173}

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: ["redis-server"]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # nginx는 시작 시 upstream(web, frontend) 이름을 해석하므로 둘 다 준비된 뒤에 띄운다.
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      # 호스트(Windows)의 node_modules와 컨테이너(Linux)용 네이티브 바이너리가 섞이지 않도록 분리
      - /frontend/node_modules
    command: sh -lc "npm ci || npm i && npm run dev -- --host 0.0.0.0"
    expose:
      - "5173"
    environment:
      - VITE_PORT=5173
      - VITE_HMR_CLIENT_PORT=${NGINX_PORT:-8080}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
